# ==============================================================================
# Sovereign Bunny Cluster Deployment Template
# Copy this template to your environment deployment directory (e.g. deploy/my-cluster/)
# ==============================================================================
apiVersion: v1
kind: Namespace
metadata:
  name: ${SOVEREIGN_NAMESPACE:-sovereign-cluster}
  labels:
    sovereign.network/cluster: "${SOVEREIGN_CLUSTER_NAME:-sovereign}"
    network.sovereign/zero-trust: "enforced"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: sovereign-node-config
  namespace: ${SOVEREIGN_NAMESPACE:-sovereign-cluster}
data:
  CHAIN_ID: "1337"
  NETWORK_NAME: "Sovereign Ledger"
  RPC_PORT: "8545"
  P2P_PORT: "30303"
  ENCLAVE_CAPABILITY: "SimulatedDev"
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: bunny-node
  namespace: ${SOVEREIGN_NAMESPACE:-sovereign-cluster}
spec:
  serviceName: bunny-node
  replicas: 1
  selector:
    matchLabels:
      app: bunny-node
  template:
    metadata:
      labels:
        app: bunny-node
    spec:
      containers:
        - name: node
          image: sovereign-reth:latest
          command: ["sovereign-node", "--chain", "genesis.json"]
          ports:
            - containerPort: 8545
              name: rpc
            - containerPort: 30303
              name: p2p
